name: Sanitize

on:
  pull_request:
    branches: [master]
    paths:
      - "custom/*.json"
      - "mp3/**"
      - "**.mp3"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanitize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v5

      - name: Install sox, jq and Python packages
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq -y install libsox-fmt-mp3 sox jq
          python3 -m pip install numpy typing_extensions
          python3 -m pip install -r requirements.txt

      - name: Get changed files
        uses: lots0logs/gh-action-get-changed-files@2.2.2
        with:
          token: ${{ github.token }}

      - name: Run sanitizer
        id: check-sanitize
        continue-on-error: true
        run: |
          python3 scripts/sanitize.py \
            -v \
            --db -10.0 \
            "$HOME/files.json"

      - name: Check if JSON file is present
        id: check-json
        continue-on-error: true
        run: |
          jq -r '
            [
              .[]
              | select(
                  startswith("custom/")
                  or startswith("mp3/")
                )
              | split("/")[1]
              | sub("\\.json$"; "")
            ]
            | unique[]
          ' "$HOME/files.json" |
          xargs -r -I {} test -f "custom/{}.json"

      - name: Check if there are at most 20 sounds
        id: check-files
        continue-on-error: true
        run: |
          jq -r '
            [
              .[]
              | select(
                  startswith("custom/")
                  or startswith("mp3/")
                )
              | split("/")[1]
              | sub("\\.json$"; "")
            ]
            | unique[]
          ' "$HOME/files.json" |
          xargs -r -I {} sh -c '
            directory="mp3/$1"

            if [ ! -d "$directory" ]; then
              exit 1
            fi

            count="$(find "$directory" -type f | wc -l)"
            test "$count" -le 20
          ' -- {}

      - name: Check if files are under 1 MB
        id: check-files-size
        continue-on-error: true
        run: |
          python3 scripts/check-files-size.py \
            -v \
            -- \
            "$HOME/files.json"

      - name: Create result artifact
        if: always() && github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}

          CHECK_JSON: ${{ steps.check-json.outcome }}
          CHECK_FILES: ${{ steps.check-files.outcome }}
          CHECK_FILES_SIZE: ${{ steps.check-files-size.outcome }}
          CHECK_SANITIZE: ${{ steps.check-sanitize.outcome }}
          SANITIZER_CHANGED: ${{ steps.sanitizer-changes.outputs.changed }}
        run: |
          mkdir -p ci-result

          jq '
            [
              .[]
              | select(
                  startswith("custom/")
                  or startswith("mp3/")
                )
              | split("/")[1]
              | sub("\\.json$"; "")
            ]
            | map(select(length > 0))
            | unique
          ' "$HOME/files.json" > ci-result/logins.json

          jq -n \
            --argjson pr "$PR_NUMBER" \
            --arg headSha "$HEAD_SHA" \
            --arg headRepository "$HEAD_REPOSITORY" \
            --arg headRef "$HEAD_REF" \
            --slurpfile logins ci-result/logins.json \
            --arg json "$CHECK_JSON" \
            --arg files "$CHECK_FILES" \
            --arg filesSize "$CHECK_FILES_SIZE" \
            --arg sanitize "$CHECK_SANITIZE" \
            --arg sanitizerChanged "$SANITIZER_CHANGED" \
            '{
              version: 1,
              pr: $pr,
              headSha: $headSha,
              headRepository: $headRepository,
              headRef: $headRef,
              logins: $logins[0],
              checks: {
                json: ($json == "success"),
                files: ($files == "success"),
                filesSize: ($filesSize == "success"),
                sanitize: ($sanitize == "success"),
                sanitizerChanged: ($sanitizerChanged == "true")
              }
            }' > ci-result/result.json

      - name: Upload result artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sanitize-result
          path: ci-result/result.json
          if-no-files-found: error
          retention-days: 1

      - name: Fail validation when necessary
        if: always()
        env:
          CHECK_JSON: ${{ steps.check-json.outcome }}
          CHECK_FILES: ${{ steps.check-files.outcome }}
          CHECK_FILES_SIZE: ${{ steps.check-files-size.outcome }}
          CHECK_SANITIZE: ${{ steps.check-sanitize.outcome }}
          SANITIZER_CHANGED: ${{ steps.sanitizer-changes.outputs.changed }}
        run: |
          failed=false

          if [ "$CHECK_JSON" != "success" ]; then
            echo "::error::.json file is missing"
            failed=true
          fi

          if [ "$CHECK_FILES" != "success" ]; then
            echo "::error::A directory contains more than 20 sounds"
            failed=true
          fi

          if [ "$CHECK_FILES_SIZE" != "success" ]; then
            echo "::error::An MP3 file is over 1 MB"
            failed=true
          fi

          if [ "$CHECK_SANITIZE" != "success" ]; then
            echo "::error::The sanitizer failed"
            failed=true
          fi

          if [ "$failed" = "true" ]; then
            exit 1
          fi
